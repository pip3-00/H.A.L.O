<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>monitoreo</title>
</head>

<body>
    <header>
        <h1>Monitor de Salud</h1>
    </header>

    <main>
        <section id="seccion-formulario">
            <h2>Registro de Mediciones</h2>
            <div class="campo">
                <label for="dia-mision">Día de misión</label>
                <input type="number" id="dia-mision" min="1" value="1" autocomplete="off">
            </div>
            <div class="campo">
                <label for="habitat">Ubicacion de la mision</label>
                <select id="habitat">
                    <option value="iss">Estacion Espacial</option>
                    <option value="transito">Nave en Transito a Marte</option>
                    <option value="luna">Base Lunar</option>
                    <option value="marte" selected>Base en Marte</option>
                </select>
            </div>
            <select id="escenario">
                <option value="normal">Normal</option>
                <option value="fiebre">Fiebre</option>
                <option value="hipotension">Hipotensión</option>
                <option value="hipoglucemia">Hipoglucemia</option>
            </select>
            <button type="button" id="btn-astroskin">Leer Astroskin (simulado)</button>
            <button type="button" id="btn-vivo">Iniciar modo en vivo</button>
            <form id="form-salud">
                <div class="campo">
                    <label for="temperatura">Temperatura (°C)</label>
                    <input type="number" id="temperatura" step="0.1">
                </div>
                <div class="campo">
                    <label for="frecuencia"> Frecuencia cardíaca (lpm)</label>
                    <input type="number" id="frecuencia" step="1">
                </div>
                <div class="campo">
                    <label for="sistolica">Presión sistólica (mmHg)</label>
                    <input type="number" id="sistolica" step="1">
                </div>
                <div class="campo">
                    <label for="diastolica">Presión diastólica (mmHg)</label>
                    <input type="number" id="diastolica" step="1">
                </div>
                <div class="campo">
                    <label for="glucosa">Glucosa (mg/dl)</label>
                    <input type="number" id="glucosa" step="1">
                </div>
                <div class="campo">
                    <label for="sueno">Horas de sueño(ultimas 24 horas)</label>
                    <input type="number" id="sueno" step="0.5">
                </div>
                <div class="campo">
                    <label for="animo">Estado de Animo (1 a 5)</label>
                    <input type="number" id="animo" step="1">
                </div>
            </form>
        </section>

        <section id="seccion-resultados">
            <h2>Estado de Salud</h2>
            <div id="aviso-tierra"></div>
            <div id="resultado"></div>
            <div id="panel-entorno"></div>
            <button type="button" id="btn-graficar">Graficar datos recolectados</button>
            <h3>Signos Vitales</h3>
            <canvas id="grafica-vitales" width="700" height="300"></canvas>
            <h3>Bienestar</h3>
            <canvas id="grafica-bienestar" width="700" height="250"></canvas>
            
<section id="seccion-asistente">
    <h3>Asistente de a bordo - run3rs</h3>

    <p>
        Consulta tus mediciones y recibe orientación
        del asistente inteligente.
    </p>

    <form id="formulario-asistente">
        <div class="campo">
            <label for="pregunta-asistente">
                ¿Qué deseas consultar?
            </label>

            <textarea
                id="pregunta-asistente"
                maxlength="1000"
                placeholder="Ejemplo: ¿Por qué mi glucosa está en alerta?"
                required
            ></textarea>
        </div>

        <button type="submit" id="btn-asistente">
            Consultar asistente de a bordo
        </button>
    </form>

    <div id="chat-ia" aria-live="polite"></div>
</section>

        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
