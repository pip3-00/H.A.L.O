<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>run3rs · Monitor de salud</title>
</head>

<body>
    <header>
        <div class="marca"><span class="marca-punto"></span><h1>run3rs</h1><span class="marca-sub">Monitor de salud del astronauta</span></div>
        <span id="fuente-logica" data-fuente="espera">Lógica: en espera</span>
        <span class="marca-nota">Prototipo · datos simulados · no es un dispositivo médico</span>
    </header>

    <main>
        <section id="seccion-formulario">
            <h2>Registro de Mediciones</h2>
            <div class="campo">
                <label for="dia-mision">Día de misión</label>
                <input type="number" id="dia-mision" min="1" value="1" autocomplete="off">
            </div>
            <div class="campo">
                <label for="habitat">Ubicacion de la mision</label>
                <select id="habitat">
                    <option value="iss">Estacion Espacial</option>
                    <option value="transito">Nave en Transito a Marte</option>
                    <option value="luna">Base Lunar</option>
                    <option value="marte" selected>Base en Marte</option>
                </select>
            </div>
            <div class="campo"><label for="escenario">Escenario simulado</label><select id="escenario">
                <option value="normal">Normal</option>
                <option value="fiebre">Fiebre</option>
                <option value="hipotension">Hipotensión</option>
                <option value="hipoglucemia">Hipoglucemia</option>
            </select></div>
            <button type="button" id="btn-vivo">Iniciar datos simulados</button>
            <form id="form-salud">
                <div class="campo">
                    <label for="temperatura">Temperatura (°C)</label>
                    <input type="number" id="temperatura" step="0.1">
                </div>
                <div class="campo">
                    <label for="frecuencia"> Frecuencia cardíaca (lpm)</label>
                    <input type="number" id="frecuencia" step="1">
                </div>
                <div class="campo">
                    <label for="sistolica">Presión sistólica (mmHg)</label>
                    <input type="number" id="sistolica" step="1">
                </div>
                <div class="campo">
                    <label for="diastolica">Presión diastólica (mmHg)</label>
                    <input type="number" id="diastolica" step="1">
                </div>
                <div class="campo">
                    <label for="glucosa">Glucosa (mg/dl)</label>
                    <input type="number" id="glucosa" step="1">
                </div>
                <div class="campo">
                    <label for="sueno">Horas de sueño(ultimas 24 horas)</label>
                    <input type="number" id="sueno" step="0.5">
                </div>
                <div class="campo">
                    <label>Estado de ánimo</label>
                    <input type="hidden" id="animo">
                    <div id="animo-caras" role="radiogroup" aria-label="Estado de ánimo"></div>
                </div>
            <button type="submit" id="btn-evaluar">Evaluar mediciones</button>
            </form>
        </section>

        <section id="seccion-resultados">
            <h2>Estado de Salud</h2>
            <button type="button" id="btn-reloj">Ver simulación</button>
            <div id="reloj-panel" hidden>
                <div id="reloj"></div>
            </div>
            <div id="aviso-tierra"></div>
            <div id="resultado"></div>
            <div id="panel-entorno"></div>
            <button type="button" id="btn-graficar">Graficar datos recolectados</button>
            <h3>Corazón, presión y glucosa</h3>
            <canvas id="grafica-vitales" width="700" height="300"></canvas>
            <h3>Temperatura y bienestar</h3>
            <canvas id="grafica-bienestar" width="700" height="250"></canvas>
            
<section id="seccion-asistente">
    <h3>Nova · asistente de a bordo</h3>

    <div class="nova-escenario">
        <canvas id="nova-orbe" aria-hidden="true"></canvas>
        <p id="nova-subtitulo" aria-live="polite">Pulsa «Activar a Nova» y di «Oye Nova».</p>
    </div>

    <div id="controles-voz">
        <button type="button" id="btn-microfono">🎙 Activar a Nova</button>
        <span id="estado-microfono" aria-live="polite"></span>
    </div>

    <div class="nova-secundarios">
        <button type="button" id="btn-escribir">⌨ Escribir en vez de hablar</button>
        <button type="button" id="btn-transcripcion">Ver transcripción</button>
    </div>

    <form id="formulario-asistente" hidden>
        <div class="campo">
            <label for="pregunta-asistente">¿Qué deseas consultar?</label>
            <textarea
                id="pregunta-asistente"
                maxlength="1000"
                placeholder="Ejemplo: ¿Por qué mi glucosa está en alerta?"
                required
            ></textarea>
        </div>

        <button type="submit" id="btn-asistente">
            Consultar a Nova
        </button>
    </form>

    <div id="chat-ia" hidden></div>
</section>

        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
